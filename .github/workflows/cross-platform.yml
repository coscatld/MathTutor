name: Cross-platform verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            desktop/package-lock.json
      - name: Install backend
        run: python -m pip install -e ".[dev]"
      - name: Install frontend
        run: npm ci
        working-directory: web
      - name: Install desktop contracts
        run: npm ci
        working-directory: desktop
      - name: Verify memory ordering with tied and backward-moving clocks
        run: python -m pytest tests/test_memory_write_order.py -q
      - name: Verify Windows restore concurrency before the full suite
        if: runner.os == 'Windows'
        run: python -m pytest tests/test_phase6_main_integration.py -k "restore or maintenance" -q --durations=10
      # setup-python supplies build/test Python only, never the distributable runtime.
      # check.py reports distribution as SKIPPED when no target runtime is provisioned.
      - name: Verify backend, frontend, build, and desktop contracts
        run: python scripts/check.py
