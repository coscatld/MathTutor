name: Deploy site

on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish site/out to GitHub Pages after a successful build'
        type: boolean
        default: false

concurrency:
  group: deploy-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Static export
        run: npm run build
      - name: Verify export
        run: npm run verify:export
      - name: Upload Pages artifact
        if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site/out

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/configure-pages@v5.0.0
      - id: deployment
        uses: actions/deploy-pages@v4.0.5
